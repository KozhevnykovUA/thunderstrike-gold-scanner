name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'requirements.txt'
      - 'config/**'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect diagnostics
        run: python collector.py

      - name: Show TSM validation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/diagnostics.json'))
          print('Selected URL:', d.get('selected_url'))
          print('Columns:', d.get('selected_columns'))
          for x in d.get('selected_items', []):
              print(x['name'], x.get('row'))
          for s in d.get('sources', []):
              print('SOURCE', s.get('url'), 'HTTP', s.get('http_status'), 'ROWS', s.get('row_count'))
          PY

      - name: Commit diagnostic output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/diagnostics.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike market diagnostics'
            git push
          fi
