name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'import_bbb_snapshot.py'
      - 'import_tsm_public.py'
      - 'validate_bbb_snapshot.py'
      - 'optimizer.py'
      - 'disenchant_optimizer.py'
      - 'requirements.txt'
      - 'browser/**'
      - 'config/**'
      - 'recipes/**'
      - 'data/bbb_snapshot.json'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: thunderstrike-market-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate browser collector syntax
        run: node --check browser/bbb_collector.js

      - name: Collect source diagnostics and live prices
        run: python collector.py

      - name: Validate browser BBB snapshot when present
        run: python validate_bbb_snapshot.py

      - name: Import browser BBB snapshot when present
        run: python import_bbb_snapshot.py

      - name: Import official TSM public prices
        run: python import_tsm_public.py

      - name: Build Enchanting report
        run: python optimizer.py

      - name: Build disenchant thresholds
        run: python disenchant_optimizer.py

      - name: Show optimizer summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/prices.json'))
          d=json.load(open('data/enchanting_report.json'))
          de=json.load(open('data/disenchant_thresholds.json'))
          print('Price source:', p.get('source'))
          print('TSM items imported:', p.get('tsm_items_imported'))
          print('TSM latest updated:', p.get('tsm_latest_updated_at'))
          print('Market:', d['market'])
          print('Baseline route:', d.get('baseline_route_segments'))
          print('Baseline total:', d.get('baseline_route_summary'))
          print('All route:', d.get('all_route_segments'))
          print('All total:', d.get('all_route_summary'))
          print('Disenchant thresholds:')
          for x in de['thresholds']:
              print(x['item_type'], x['item_level_min'], '-', x['item_level_max'], 'EV=', x['expected_disenchant_value_gold'], 'safe<=', x['conservative_buy_ceiling_gold'])
          PY

      - name: Commit generated output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prices.json data/diagnostics.json data/enchanting_report.json data/disenchant_thresholds.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike scanner reports'
            git push
          fi
