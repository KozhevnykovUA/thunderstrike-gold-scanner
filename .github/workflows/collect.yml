name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'requirements.txt'
      - 'config/**'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect diagnostics
        run: python collector.py

      - name: Show Arcane Dust validation
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/diagnostics.json'))
          a=next(x for x in d['items'] if x['id']==22445)
          print('HTTP:', a.get('http_status'))
          print('Final URL:', a.get('final_url'))
          print('Candidates:', a.get('money_candidates_gold'))
          print('Expected:', a.get('expected_validation_gold'))
          print('Validation match:', a.get('validation_match'))
          print('Headers:', a.get('response_headers'))
          print('Body preview:', a.get('body_preview'))
          PY

      - name: Commit diagnostic output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/diagnostics.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike market diagnostics'
            git push
          fi
