name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'import_bbb_snapshot.py'
      - 'import_tsm_public.py'
      - 'probe_tsm_web_metrics.py'
      - 'validate_bbb_snapshot.py'
      - 'optimizer.py'
      - 'disenchant_optimizer.py'
      - 'cooking_profit.py'
      - 'cooking_leveling_optimizer.py'
      - 'cooking_recipe_roi.py'
      - 'profession_profit.py'
      - 'top_opportunities.py'
      - 'low_level_bs_gear.py'
      - 'requirements.txt'
      - 'browser/**'
      - 'config/**'
      - 'recipes/**'
      - 'data/bbb_snapshot.json'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: thunderstrike-market-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate browser collector syntax
        run: node --check browser/bbb_collector.js
      - name: Collect source diagnostics and live prices
        run: python collector.py
      - name: Validate browser BBB snapshot when present
        run: python validate_bbb_snapshot.py
      - name: Import browser BBB snapshot when present
        run: python import_bbb_snapshot.py
      - name: Import official TSM public prices
        run: python import_tsm_public.py
      - name: Probe TSM regional sale metrics
        run: python probe_tsm_web_metrics.py
      - name: Build Enchanting leveling report
        run: python optimizer.py
      - name: Build disenchant thresholds
        run: python disenchant_optimizer.py
      - name: Build Cooking profit report
        run: python cooking_profit.py
      - name: Optimize Cooking 1-300 net leveling cost
        run: python cooking_leveling_optimizer.py
      - name: Build Cooking recipe ROI report
        run: python cooking_recipe_roi.py
      - name: Build low-level BS gear report
        run: python low_level_bs_gear.py
      - name: Build Blacksmithing and Enchanting profit report
        run: python profession_profit.py
      - name: Build unified Top Opportunities report
        run: python top_opportunities.py
      - name: Show gold scanner summary
        run: |
          python - <<'PY'
          import json
          top=json.load(open('data/top_opportunities.json'))
          cook=json.load(open('data/cooking_leveling_1_300.json'))
          roi=json.load(open('data/cooking_recipe_roi.json'))
          gear=json.load(open('data/low_level_bs_gear.json'))
          print('LOW LEVEL BS GEAR')
          for x in gear.get('items',[]): print(x['name'],'mats=',x['material_cost_gold'],'finished=',x['output_recent_or_market_gold'],'buy_finished=',x['cheaper_to_buy_finished'])
          print('COOKING 1-300 ROUTE')
          for x in cook.get('route',[]): print(x['from'],'-',x['to'],x['output'],'crafts=',x['expected_crafts'],'net=',x['segment_net_gold'])
          print('Cooking estimated net:',cook.get('estimated_net_material_cost_gold'))
          print('COOKING RECIPE ROI')
          for x in roi.get('recommendations',[]):
              if not x.get('owned'): print(x.get('recipe'),'price=',x.get('recipe_ah_recent_gold'),'profit=',x.get('profit_per_craft_gold'),'payback=',x.get('crafts_to_payback_if_sold'),'verdict=',x.get('verdict'))
          print('TOP OPPORTUNITIES TODAY')
          for i,x in enumerate(top.get('top',[])[:10],1): print(i, x.get('profession'), x.get('output'), 'profit=',x.get('profit_per_craft_gold'), 'rate=',x.get('region_sale_rate'), 'sold/day=',x.get('region_avg_daily_sold'), 'expected=',x.get('expected_profit_per_listing_gold'))
          PY
      - name: Commit generated output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prices.json data/diagnostics.json data/enchanting_report.json data/disenchant_thresholds.json data/cooking_profit.json data/cooking_leveling_1_300.json data/cooking_recipe_roi.json data/low_level_bs_gear.json data/profession_profit.json data/top_opportunities.json data/tsm_web_metrics_probe.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike scanner reports'
            git push
          fi
