name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'optimizer.py'
      - 'requirements.txt'
      - 'config/**'
      - 'recipes/**'
      - 'data/prices.json'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect source diagnostics
        run: python collector.py

      - name: Build Enchanting report
        run: python optimizer.py

      - name: Show optimizer summary
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/enchanting_report.json'))
          print('Market:', d['market'])
          for x in d['recipes']:
              print(x['name'], x['material_cost_gold'])
          print('320-335 comparison:', d.get('comparison_320_335'))
          PY

      - name: Commit generated output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/diagnostics.json data/enchanting_report.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike scanner reports'
            git push
          fi
