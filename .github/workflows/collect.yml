name: Collect Thunderstrike prices

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'collector.py'
      - 'optimizer.py'
      - 'requirements.txt'
      - 'config/**'
      - 'recipes/**'
      - '.github/workflows/collect.yml'
  schedule:
    - cron: '17 */3 * * *'

concurrency:
  group: thunderstrike-market-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect source diagnostics and live prices
        run: python collector.py

      - name: Build Enchanting report
        run: python optimizer.py

      - name: Show optimizer summary
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/prices.json'))
          d=json.load(open('data/enchanting_report.json'))
          print('Price source:', p.get('source'))
          print('Live items updated:', p.get('live_items_updated'))
          print('Market:', d['market'])
          print('Ranking:', d.get('economics_model', {}).get('ranking_metric'))
          for x in d['recipes']:
              print(
                  x['name'],
                  'gross=', x.get('gross_material_cost_gold'),
                  'recovery=', x.get('sale_recovery', {}).get('expected_recovery_gold'),
                  'net=', x.get('net_craft_cost_gold'),
                  'recovery_status=', x.get('sale_recovery', {}).get('status'),
              )
          print('Baseline route:', d.get('baseline_route_segments'))
          print('Conditional route:', d.get('conditional_route_segments'))
          print('All route:', d.get('all_route_segments'))
          PY

      - name: Commit generated output
        run: |
          git config user.name 'thunderstrike-gold-scanner'
          git config user.email 'actions@users.noreply.github.com'
          git add data/prices.json data/diagnostics.json data/enchanting_report.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update Thunderstrike scanner reports'
            git push
          fi
